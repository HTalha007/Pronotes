<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="web_standard" name="shell-type"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              bg: '#F1F8F5',
              border: '#D9E8E1',
              card: '#FFFFFF',
              primary: '#CFE8DE',
              'primary-hover': '#BFE0D2',
              ink: '#1F4A40',
              muted: '#61756F',
              subtle: '#8C9E97',
              pill: '#E2F0EA'
            },
            rose: {
              border: '#E8A4A4',
              bg: '#FDF2F2',
              text: '#8A2F2F'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F1F8F5] text-[#1F4A40] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#CFE8DE] selection:text-[#1F4A40]">
<!-- Üst Gezinme Çubuğu -->
<header class="w-full h-16 border-b border-[#D9E8E1] bg-[#F1F8F5]/80 backdrop-blur-sm sticky top-0 z-40">
<div class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between">
<div class="flex items-center gap-3">
<a class="flex items-center gap-2.5 text-[#1F4A40] hover:opacity-90 transition-opacity" href="#">
<div class="w-7 h-7 rounded-[6px] bg-[#CFE8DE] flex items-center justify-center text-[#1F4A40]">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
</svg>
</div>
<span class="font-semibold text-[16px] tracking-tight">NoteVault Kasa</span>
</a>
</div>
<div class="flex items-center gap-4">
<!-- Sakin Gösterge Rozeti -->
<div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#E2F0EA] border border-[#D9E8E1]/60 text-[12px] text-[#1F4A40] font-medium">
<span class="w-1.5 h-1.5 rounded-full bg-[#38675a]"></span>
<span>Korumalı Alan</span>
</div>
<!-- Profil İnisiyalleri (Pastel Sage) -->
<div class="w-8 h-8 rounded-full bg-[#CFE8DE] border border-[#D9E8E1] flex items-center justify-center text-[12px] font-semibold text-[#1F4A40]">
          NV
        </div>
</div>
</div>
</header>
<!-- Merkez Kilit Açma Alanı -->
<main class="flex-1 flex items-center justify-center px-4 py-12">
<div class="w-full max-w-[420px] bg-white rounded-[8px] border border-[#D9E8E1] p-8 shadow-[0_1px_3px_rgba(0,0,0,0.03)] flex flex-col">
<!-- Başlık & İkon Alanı -->
<div class="flex flex-col items-center text-center">
<!-- Lucide Stili Sade Kilit İkonu (20px, 1.5px stroke) -->
<div class="w-10 h-10 rounded-[6px] bg-[#F1F8F5] border border-[#D9E8E1] flex items-center justify-center mb-3 text-[#1F4A40]">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
</svg>
</div>
<h1 class="text-[20px] font-semibold text-[#1F4A40] tracking-tight">
          Kasa kilitli
        </h1>
<p class="text-[14px] text-[#61756F] mt-1 leading-normal max-w-xs">
          Şifreli notlarınıza erişmek için ana şifrenizi girin.
        </p>
</div>
<!-- Kilit Açma Formu -->
<form class="mt-6 flex flex-col" onsubmit="event.preventDefault();">
<div>
<label class="block text-[13px] font-medium text-[#1F4A40] mb-1.5" for="vault-password">
            Ana Şifre
          </label>
<div class="relative">
<input autocomplete="current-password" class="w-full h-11 px-3.5 pr-10 text-[14px] font-mono rounded-[6px] bg-white border border-[#E8A4A4] text-[#1F4A40] placeholder-[#8C9E97] focus:outline-none focus:ring-1 focus:ring-[#8A2F2F] transition-all" id="vault-password" placeholder="Ana şifreniz" type="password" value="yanlis_sifre_ornegi"/>
<button aria-label="Şifreyi Göster" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8C9E97] hover:text-[#1F4A40] transition-colors p-0.5" onclick="const input = document.getElementById('vault-password'); input.type = input.type === 'password' ? 'text' : 'password';" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
<!-- Sakin Satır İçi Hata Durumu (Soft Rose / Sakin Metin) -->
<div class="mt-2 flex items-center justify-between text-[12px] bg-[#FDF2F2] border border-[#F8E1E1] text-[#8A2F2F] px-2.5 py-1.5 rounded-[4px]">
<div class="flex items-center gap-1.5 font-medium">
<span>✕</span>
<span>Şifre Yanlış</span>
</div>
<span class="text-[11px] text-[#8A2F2F]/80">4 deneme hakkı kaldı</span>
</div>
</div>
<!-- Birincil Buton -->
<button class="mt-5 w-full h-11 bg-[#CFE8DE] hover:bg-[#BFE0D2] active:bg-[#B3D6C8] text-[#1F4A40] font-semibold text-[14px] rounded-[6px] transition-colors duration-150 flex items-center justify-center gap-2 cursor-pointer shadow-none" type="submit">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
<path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
</svg>
<span>Kasayı Aç</span>
</button>
<!-- Buton Altı Bilgi & Geri Dön Linki -->
<div class="mt-5 text-center flex flex-col items-center gap-2">
<p class="text-[12px] text-[#61756F]">
            Ana şifren sunucuya gönderilmez.
          </p>
<a class="text-[13px] font-medium text-[#1F4A40] hover:underline underline-offset-2 transition-colors" href="#">
            Notlara dön
          </a>
</div>
</form>
</div>
</main>
<!-- Minimal Alt Bilgi (Footer) -->
<footer class="w-full py-5 border-t border-[#D9E8E1]/60">
<div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-[12px] text-[#61756F]">
<div>
        © 2024 NoteVault. Sıfır bilgi mimarisiyle uçtan uca korumalı.
      </div>
<div class="text-[11px] font-mono text-[#8C9E97]">
        AES-GCM 256 • Yerel Şifreleme
      </div>
</div>
</footer>
</body></html>
